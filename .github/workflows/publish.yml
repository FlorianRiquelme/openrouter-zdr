name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10, which predates OIDC trusted publishing
      # (npm >= 11.5.1), so without this the publish 404s for lack of auth.
      # Pinned to the major so a future npm 13 cannot break releases on its
      # own; nothing bumps this line automatically. npm 12 needs node
      # >= 22.22.2, which node-version: 22 satisfies -- do not pin node lower.
      - run: npm install -g npm@12
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm publish --provenance --access public
